<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live widget</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#ff2d95;--c2:#7b2dff;--c3:#00e5ff;--glass:rgba(16,10,36,.82)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#fff}
.wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
.pop{width:min(100%,760px);transition:transform .9s cubic-bezier(.2,1.3,.35,1),opacity .6s}
.pop.hide{transform:translateY(80px) scale(.75);opacity:0}
.pop.bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.07)}}
.card{padding:3px;border-radius:30px;background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c3),var(--c1));
  box-shadow:0 0 36px color-mix(in srgb,var(--c2) 55%,transparent),0 0 90px color-mix(in srgb,var(--c1) 25%,transparent);animation:spin 5s linear infinite}
@keyframes spin{to{--a:360deg}}
.inner{position:relative;overflow:hidden;border-radius:27px;background:var(--glass);padding:22px 26px 20px}
.inner::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-18deg);animation:shine 6s ease-in-out infinite 1.5s;pointer-events:none}
@keyframes shine{0%{left:-60%}35%,100%{left:140%}}
.head{display:flex;align-items:center;gap:18px}
.avatar{position:relative;flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c3);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.who{min-width:0;flex:1}
.name{font-family:'Unbounded','Segoe UI',sans-serif;font-size:30px;line-height:1.15;margin:0;background:linear-gradient(90deg,#fff,var(--c3),#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes flow{to{background-position:-200% 0}}
.sub{margin:6px 0 0;font-size:17px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:color-mix(in srgb,var(--c1) 20%,transparent);font-weight:700;font-size:16px}
.live i{width:11px;height:11px;border-radius:50%;background:var(--c1);box-shadow:0 0 12px var(--c1);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.ticker{position:relative;height:40px;margin-top:18px;overflow:hidden}
.msg{position:absolute;left:0;right:0;top:0;font-size:23px;font-weight:700;line-height:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateY(120%);opacity:0;transition:transform .6s cubic-bezier(.2,1,.3,1),opacity .6s}
.msg.in{transform:none;opacity:1}
.msg.out{transform:translateY(-120%);opacity:0}
.goal{margin-top:12px}
.goal-top{display:flex;justify-content:space-between;font-size:16px;margin-bottom:8px;opacity:.9}
.bar{height:16px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;position:relative;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));transition:width 1.6s cubic-bezier(.2,1,.3,1)}
.fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.22) 0 12px,transparent 12px 24px);animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:24px 0}}
.spark{position:absolute;bottom:-10px;border-radius:50%;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-340px) scale(.2);opacity:0}}
.conf{position:absolute;width:10px;height:10px;border-radius:2px;pointer-events:none;animation:conf 1.3s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes conf{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(540deg) scale(.3);opacity:0}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="pop hide" id="pop">
    <div class="card"><div class="inner" id="inner">
      <div class="head">
        <div class="avatar" id="avatar"></div>
        <div class="who"><h1 class="name" id="name"></h1><p class="sub" id="sub"></p></div>
        <div class="live"><i></i>LIVE</div>
      </div>
      <div class="ticker" id="ticker"></div>
      <div class="goal">
        <div class="goal-top"><span id="goalTitle"></span><span id="goalNum"></span></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
    </div></div>
  </div>
</div>
<script>
/* Стартовые значения (потом всё меняется с пульта control.html) */
const DEFAULT = {
  name:"Твоё имя", subtitle:"Заходи, будет жарко 🔥", avatarEmoji:"😎", avatarImage:"",
  messages:["Подпишись, чтобы не пропустить эфир","Тапай по экрану — поддержи стрим ❤️","Пиши в чат — читаю всех"],
  messageSeconds:4, goalTitle:"Цель: новые подписчики", current:120, target:500,
  c1:"#ff2d95", c2:"#7b2dff", c3:"#00e5ff", sparkles:true, visible:true, burst:0
};
const $ = id => document.getElementById(id);
const topic = new URLSearchParams(location.search).get("t");
let state = Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem("tw_last") || "{}"));
let sig = "", els = [], idx = 0, timer, lastBurst = state.burst, ready = false, sparkTimer;

function buildTicker(msgs, sec){
  const s = JSON.stringify([msgs, sec]); if (s === sig) return; sig = s;
  clearInterval(timer); $("ticker").innerHTML = ""; idx = 0;
  els = msgs.filter(Boolean).map(t => { const d = document.createElement("div"); d.className = "msg"; d.textContent = t; $("ticker").appendChild(d); return d; });
  if (!els.length) return;
  requestAnimationFrame(() => requestAnimationFrame(() => els[0].classList.add("in")));
  if (els.length > 1) timer = setInterval(() => {
    const p = els[idx]; p.classList.remove("in"); p.classList.add("out");
    idx = (idx + 1) % els.length; const n = els[idx];
    n.classList.remove("out"); void n.offsetWidth; n.classList.add("in");
    setTimeout(() => p.classList.remove("out"), 700);
  }, Math.max(2, sec) * 1000);
}
function burst(){
  const cols = [state.c1, state.c2, state.c3, "#fff"];
  for (let i = 0; i < 50; i++){
    const e = document.createElement("span"), a = Math.random() * 6.28, d = 120 + Math.random() * 240;
    e.className = "conf";
    e.style.cssText = `--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-50}px;background:${cols[i%4]};left:50%;top:50%`;
    $("wrap").appendChild(e); setTimeout(() => e.remove(), 1400);
  }
  const p = $("pop"); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump");
}
function setSparkles(on){
  clearInterval(sparkTimer); if (!on) return;
  const cols = () => [state.c1, state.c2, state.c3, "#fff"];
  sparkTimer = setInterval(() => {
    const s = document.createElement("span"), z = 4 + Math.random() * 7, c = cols()[Math.floor(Math.random() * 4)];
    s.className = "spark";
    s.style.cssText = `left:${Math.random()*100}%;width:${z}px;height:${z}px;background:${c};box-shadow:0 0 10px ${c};animation-duration:${2.5+Math.random()*2.5}s`;
    $("inner").appendChild(s); setTimeout(() => s.remove(), 5500);
  }, 450);
}
function apply(s){
  state = Object.assign({}, DEFAULT, s);
  localStorage.setItem("tw_last", JSON.stringify(state));
  const r = document.documentElement.style;
  r.setProperty("--c1", state.c1); r.setProperty("--c2", state.c2); r.setProperty("--c3", state.c3);
  $("name").textContent = state.name; $("sub").textContent = state.subtitle;
  const av = $("avatar"); av.textContent = "";
  if (state.avatarImage){ const im = new Image(); im.src = state.avatarImage; av.appendChild(im); } else av.textContent = state.avatarEmoji;
  $("goalTitle").textContent = state.goalTitle;
  $("goalNum").textContent = state.current + " / " + state.target;
  $("fill").style.width = Math.max(0, Math.min(100, state.current / (state.target || 1) * 100)) + "%";
  buildTicker(state.messages, state.messageSeconds);
  $("pop").classList.toggle("hide", !state.visible);
  setSparkles(state.sparkles);
  if (state.burst && state.burst !== lastBurst){ lastBurst = state.burst; if (ready) burst(); }
}
setTimeout(() => apply(state), 200);

/* Связь с пультом через ntfy.sh (публичный сервис, ключ — ?t=... в ссылке) */
if (topic){
  const connect = () => {
    const es = new EventSource("https://ntfy.sh/" + encodeURIComponent(topic) + "/sse?since=12h");
    es.onmessage = e => {
      try { const m = JSON.parse(e.data); if (m.event === "message") apply(JSON.parse(m.message)); } catch(_){}
    };
  };
  connect();
}
setTimeout(() => ready = true, 2500);
</script>
</body>
</html>
