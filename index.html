<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Editable Baroque TikTok Widget</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Роскошная барочная рамка с золотым градиентом */
        .baroque-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 320px;
            height: 120px;
            background: radial-gradient(circle, #2b050c 0%, #120104 100%);
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0,0,0,0.6);
            
            border: 6px double;
            border-image: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c) 1;
            
            position: relative;
            animation: gentleGlow 4s infinite alternate;
        }

        .baroque-widget::before, .baroque-widget::after {
            content: "⚜";
            color: #d4af37;
            font-size: 20px;
            position: absolute;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
            pointer-events: none; /* Чтобы значки не мешали кликать по тексту */
        }
        .baroque-widget::before { top: 5px; left: 10px; }
        .baroque-widget::after { bottom: 5px; right: 10px; }

        @keyframes gentleGlow {
            0% { box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 10px rgba(187, 135, 40, 0.2); }
            100% { box-shadow: 0 10px 35px rgba(0,0,0,0.8), 0 0 20px rgba(251, 245, 183, 0.5); }
        }

        .text-container {
            width: 100%;
        }

        /* Стили заголовка (золотой текст) */
        .baroque-title {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text; 
            -webkit-text-fill-color: transparent;
            font-size: 22px;
            font-weight: bold;
            font-style: italic;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
            outline: none; /* Убираем стандартную синюю рамку при редактировании */
            cursor: text;
        }

        /* Стили подзаголовка */
        .baroque-sub {
            color: #e5c158;
            font-size: 14px;
            font-style: italic;
            margin: 0;
            letter-spacing: 0.5px;
            outline: none;
            cursor: text;
        }

        /* Подсветка текста при наведении, чтобы стример понимал, что сюда можно кликнуть */
        .baroque-title:hover, .baroque-sub:hover {
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="baroque-widget">
        <div class="text-container">
            <!-- contenteditable="true" разрешает редактирование текста пользователем -->
            <p class="baroque-title" contenteditable="true">@твой_никнейм</p>
            <p class="baroque-sub" contenteditable="true">Кликни здесь, чтобы изменить текст</p>
        </div>
    </div>

</body>
</html>
